# Weekly dependency updates, grouped into one PR per ecosystem.
# Files vendored in docs/lib (jQuery, Bootstrap, easytimer) are not tracked
# by any package manager, so Dependabot cannot update them: bump them by hand.
version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      groups:
          dev-dependencies:
              dependency-type: development
              update-types: [minor, patch]

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
      groups:
          github-actions:
              patterns: ['*']

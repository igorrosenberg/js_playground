# Monthly dependency updates: one npm PR and one GitHub Actions PR, on the 1st.
# Every update, major ones included, goes into its group, so a month brings at
# most two PRs. Note that pushing a change to this file to master makes
# Dependabot run straight away, outside the schedule.
# The "Dependabot PR" workflow merges each PR that passes and @mentions the
# owner on one that fails.
# The browser libraries in docs/lib are npm devDependencies copied by
# vendor.js; the "Dependabot PR" workflow refreshes docs/lib on each PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
    ignore:
      # Bootstrap 5 drops jQuery and changes its markup, jQuery 4 drops old
      # APIs: these upgrades need changes to the pages, not just a bump.
      - dependency-name: bootstrap
        update-types: [version-update:semver-major]
      - dependency-name: jquery
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']

name: Lint

on:
  push:
    branches: [master]
  pull_request:

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: ESLint (docs/*.js, inline scripts in docs/*.html, build and tests)
        run: npm run lint

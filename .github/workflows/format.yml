name: Format

# On every push to master, runs Prettier and folds the result into the commit that was pushed:
# the commit is amended (same author, author date and message) and master is force-pushed.
# Nobody has to format by hand, and no separate formatting commit appears in the history.
# The lease makes the force push fail rather than overwrite anything pushed meanwhile;
# the run for that newer push formats it instead.
# Pushes made with GITHUB_TOKEN do not trigger workflows, so this cannot loop.

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: format
  cancel-in-progress: true

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Amend the pushed commit and force push
        run: |
          if git diff --quiet; then
            echo "Everything is already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -a --amend --no-edit
          git push --force-with-lease=master:${{ github.sha }} origin HEAD:master
